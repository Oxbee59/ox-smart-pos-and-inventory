{% extends "base.html" %}

{% block content %}
<!-- Offline banner -->
<div id="offlineBanner" class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded hidden">
    ⚠️ You are offline – showing cached archive data. Changes will be synced when you reconnect.
</div>

<!-- Header & Filter + Search -->
<div class="flex flex-wrap justify-between items-center gap-4 mb-6">
    <h1 class="text-3xl font-bold text-[#1B5E20]">📁 Product Archive</h1>
    <div class="flex flex-wrap items-center gap-3">
        <div>
            <input type="text" id="searchInput" placeholder="🔍 Search product/brand..." 
                   class="border border-gray-300 rounded-lg px-3 py-2 w-48 md:w-64 focus:border-[#2E7D32] focus:ring-1 focus:ring-[#2E7D32] outline-none">
        </div>
        <label class="text-gray-700">Filter:</label>
        <select id="statusFilter" class="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:border-[#2E7D32] outline-none">
            <option value="ALL">ALL</option>
            <option value="ACTIVE">ACTIVE</option>
            <option value="UPDATED">UPDATED</option>
            <option value="DELETED">DELETED</option>
            <option value="PRODUCT DELETED">PRODUCT DELETED</option>
            <option value="BATCH DELETED">BATCH DELETED</option>
            <option value="PERMANENTLY DELETED">PERMANENTLY DELETED</option>
        </select>
        <button onclick="resetAndLoad()" class="bg-[#2E7D32] hover:bg-[#1B5E20] text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1 font-medium transition">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
</div>

<!-- Stats -->
<div id="statsBar" class="mb-4 text-sm text-gray-600 hidden">
    Showing <span id="shownCount">0</span> of <span id="totalCount">0</span> items
</div>

<!-- Archive List -->
<div id="archiveList" class="space-y-4">
    <div class="text-center text-gray-400 py-8">
        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
        <p>Loading archive data...</p>
    </div>
</div>

<!-- Load More Button -->
<div id="loadMoreContainer" class="text-center mt-6 hidden">
    <button id="loadMoreBtn" class="bg-[#2E7D32] hover:bg-[#1B5E20] text-white px-6 py-2 rounded-lg transition-colors flex items-center gap-2 mx-auto font-medium">
        <i class="fas fa-chevron-down"></i> Load More
    </button>
</div>

<!-- Modal: View Batches -->
<div id="batchModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl w-11/12 max-w-2xl max-h-[80vh] overflow-y-auto border border-[#E8F5E9]">
        <div class="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
            <h3 class="text-xl font-bold text-[#1B5E20]" id="batchModalTitle">Batches</h3>
            <button onclick="closeBatchModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div id="batchList" class="p-4 space-y-3"></div>
        <div class="sticky bottom-0 bg-white p-4 border-t text-right">
            <button onclick="closeBatchModal()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded transition">Close</button>
        </div>
    </div>
</div>

<!-- Modal: View Claims -->
<div id="claimsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl w-11/12 max-w-2xl max-h-[80vh] overflow-y-auto border border-[#E8F5E9]">
        <div class="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
            <h3 class="text-xl font-bold text-[#1B5E20]" id="claimsModalTitle">Claims</h3>
            <button onclick="closeClaimsModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div id="claimsList" class="p-4 space-y-3"></div>
        <div class="sticky bottom-0 bg-white p-4 border-t text-right">
            <button onclick="closeClaimsModal()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded transition">Close</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        console.log("DOM loaded – initializing Archive with Dexie");

        // ---------- Offline banner ----------
        function updateOfflineBanner() {
            const banner = document.getElementById('offlineBanner');
            if (!navigator.onLine) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }
        window.addEventListener('online', updateOfflineBanner);
        window.addEventListener('offline', updateOfflineBanner);

        // ========== DEXIE CACHE HELPERS (Unified) ==========
        const CACHE_MAX_AGE = 24 * 60 * 60 * 1000; // 24 hours

        async function getCacheTable() {
            if (!db) return null;
            try {
                return db.cache || db.table('cache');
            } catch (e) {
                return null;
            }
        }

        async function putCache(key, value) {
            if (!db) {
                try {
                    localStorage.setItem(key, JSON.stringify({ data: value, timestamp: Date.now() }));
                } catch (e) {}
                return;
            }
            try {
                const table = await getCacheTable();
                if (table) {
                    await table.put({ key, value, timestamp: Date.now() });
                } else {
                    localStorage.setItem(key, JSON.stringify({ data: value, timestamp: Date.now() }));
                }
            } catch (e) {
                console.warn('Cache put failed, using localStorage', e);
                localStorage.setItem(key, JSON.stringify({ data: value, timestamp: Date.now() }));
            }
        }

        async function getCache(key) {
            if (db) {
                try {
                    const table = await getCacheTable();
                    if (table) {
                        const entry = await table.get(key);
                        if (entry && entry.value) {
                            const age = Date.now() - (entry.timestamp || 0);
                            if (age < CACHE_MAX_AGE) {
                                return entry.value;
                            } else {
                                await table.delete(key);
                                return null;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Cache read failed', e);
                }
            }
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (Date.now() - parsed.timestamp > CACHE_MAX_AGE) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.data;
            } catch (e) {
                return null;
            }
        }

        // ========== Specific caching functions ==========
        function getArchiveCacheKey(status, search) {
            return `archive_${status}_${search || 'all'}`;
        }

        function getBatchesCacheKey(name, brand) {
            return `batches_${name}_${brand}`;
        }

        // ---------- Main variables ----------
        let allItems = [];
        let currentPage = 1;
        let totalItems = 0;
        let totalPages = 1;
        let isLoading = false;
        let hasMore = true;
        const PER_PAGE = 50;

        function formatMoney(amount) {
            return '₵' + (parseFloat(amount) || 0).toFixed(2);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Get status color — only ACTIVE changed to herbal green; others kept semantic
        function getStatusColor(action) {
            const colors = {
                'ACTIVE': '#2E7D32',
                'UPDATED': '#F59E0B',
                'DELETED': '#EF4444',
                'PRODUCT DELETED': '#EF4444',
                'BATCH DELETED': '#F87171',
                'PERMANENTLY DELETED': '#6B7280'
            };
            return colors[action] || '#999';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                return d.toLocaleString();
            } catch(e) {
                return dateStr;
            }
        }

        // Get claim status color — resolved → herbal green; active/pending kept semantic
        function getClaimStatusColor(status) {
            const colors = {
                'active': '#EF4444',
                'resolved': '#2E7D32',
                'pending': '#F59E0B'
            };
            return colors[status] || '#6B7280';
        }

        function resetAndLoad() {
            currentPage = 1;
            allItems = [];
            document.getElementById('loadMoreContainer').classList.add('hidden');
            loadArchive(true);
        }

        async function loadArchive(reset = true) {
            if (isLoading) return;
            isLoading = true;
            
            updateOfflineBanner();
            const status = document.getElementById('statusFilter').value;
            const searchTerm = document.getElementById('searchInput').value.trim();
            const cacheKey = getArchiveCacheKey(status, searchTerm);
            
            if (reset) {
                currentPage = 1;
                allItems = [];
                document.getElementById('loadMoreContainer').classList.add('hidden');
                const container = document.getElementById('archiveList');
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>Loading archive data...</p>
                    </div>
                `;
                document.getElementById('statsBar').classList.add('hidden');
            }

            let data = null;
            let fromCache = false;

            data = await getCache(cacheKey);
            if (data && data.items && data.items.length > 0) {
                fromCache = true;
                applyData(data);
            }

            if (navigator.onLine) {
                try {
                    const url = `/api/archive?status=${status}&page=${currentPage}&per_page=${PER_PAGE}&search=${encodeURIComponent(searchTerm)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    data = await res.json();
                    await putCache(cacheKey, data);
                    fromCache = false;
                    applyData(data);
                } catch (error) {
                    console.warn('API failed, using cached data if available', error);
                    if (!data) {
                        const container = document.getElementById('archiveList');
                        container.innerHTML = `
                            <div class="text-center text-red-500 py-8">
                                <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
                                <p>Failed to load archive data.</p>
                                <p class="text-xs text-gray-400 mt-1">${error.message}</p>
                            </div>
                        `;
                    }
                }
            } else if (!data) {
                const container = document.getElementById('archiveList');
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-wifi-slash text-2xl mb-2"></i>
                        <p>No cached archive data available offline.</p>
                        <p class="text-xs text-gray-400 mt-1">Please connect to the internet to load data.</p>
                    </div>
                `;
            }

            isLoading = false;
        }

        function applyData(data) {
            if (data && data.items && data.items.length > 0) {
                totalItems = data.total || 0;
                totalPages = data.total_pages || 1;
                hasMore = data.has_more || false;
                
                if (currentPage === 1) {
                    allItems = data.items || [];
                } else {
                    allItems = [...allItems, ...(data.items || [])];
                }
                
                renderArchive(allItems);
                
                document.getElementById('shownCount').textContent = allItems.length;
                document.getElementById('totalCount').textContent = totalItems;
                document.getElementById('statsBar').classList.remove('hidden');
                
                if (hasMore && allItems.length < totalItems) {
                    document.getElementById('loadMoreContainer').classList.remove('hidden');
                    document.getElementById('loadMoreBtn').textContent = `📥 Load More (${allItems.length}/${totalItems})`;
                } else {
                    document.getElementById('loadMoreContainer').classList.add('hidden');
                    if (allItems.length > 0 && allItems.length === totalItems) {
                        const container = document.getElementById('archiveList');
                        const note = document.createElement('div');
                        note.className = 'text-xs text-gray-400 text-center mt-2';
                        note.innerText = `✅ All ${totalItems} items loaded`;
                        container.appendChild(note);
                    }
                }
            } else {
                const container = document.getElementById('archiveList');
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-search text-2xl mb-2"></i>
                        <p>No archive data available.</p>
                        <p class="text-xs text-gray-400 mt-1">Try adjusting your search or filter.</p>
                    </div>
                `;
            }
        }

        function loadMore() {
            if (!hasMore || isLoading) return;
            currentPage++;
            loadArchive(false);
        }

        function renderArchive(items) {
            const container = document.getElementById('archiveList');
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            
            if (!items || !items.length) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-search text-2xl mb-2"></i>
                        <p>No archive data available.</p>
                        <p class="text-xs text-gray-400 mt-1">Try adjusting your search or filter.</p>
                    </div>
                `;
                return;
            }

            if (currentPage === 1) {
                container.innerHTML = '';
            } else {
                const notes = container.querySelectorAll('.text-xs.text-gray-400.text-center.mt-2');
                notes.forEach(n => n.remove());
            }

            const fragment = document.createDocumentFragment();
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md border border-[#E8F5E9] p-4';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex justify-between items-start mb-2';
                
                let claimsBadge = '';
                if (item.has_claims && item.total_claimed > 0) {
                    claimsBadge = `<span class="ml-2 text-xs bg-red-100 text-red-800 px-2 py-0.5 rounded-full">⚠️ ${item.total_claimed} Claimed</span>`;
                }
                
                headerDiv.innerHTML = `
                    <div>
                        <span class="font-bold text-lg text-[#1B5E20]">${escapeHtml(item.name)} (${escapeHtml(item.brand)})</span>
                        ${claimsBadge}
                    </div>
                    <div>
                        <span class="text-sm font-semibold" style="color: ${getStatusColor(item.action)}">● ${item.action}</span>
                    </div>
                `;
                card.appendChild(headerDiv);

                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'text-gray-700 text-sm mb-3';
                if (item.action === 'ACTIVE') {
                    detailsDiv.innerHTML = `
                        📦 Stock: ${item.stock} | ${formatMoney(item.cost)} | ${formatMoney(item.price)} | 💰 Disc: ${formatMoney(item.discount)} | 📂 ${escapeHtml(item.category)}
                        ${item.has_claims ? `<br><span class="text-red-500">⚠️ ${item.total_claimed} units claimed as faulty</span>` : ''}
                    `;
                } else {
                    let details = `
                        Category: ${escapeHtml(item.category)} | Stock: ${item.stock}<br>
                        Cost: ${formatMoney(item.cost)} | Selling: ${formatMoney(item.price)} | Discount: ${formatMoney(item.discount)}<br>
                        Date: ${formatDate(item.date)}
                    `;
                    if (item.action === 'BATCH DELETED' && item.batch_id) {
                        details += `<br>Batch #${item.batch_id} | Original Qty: ${item.batch_quantity} | Remaining at deletion: ${item.batch_remaining}`;
                    }
                    if (item.action === 'PRODUCT DELETED' && item.product_id) {
                        details += `<br>Product ID: #${item.product_id} | All batches archived`;
                    }
                    if (item.has_claims) {
                        details += `<br><span class="text-red-500">⚠️ ${item.total_claimed} units were claimed as faulty</span>`;
                    }
                    detailsDiv.innerHTML = details;
                }
                card.appendChild(detailsDiv);

                const btnDiv = document.createElement('div');
                btnDiv.className = 'flex justify-end gap-2 flex-wrap';
                
                if (item.has_claims && item.claims && item.claims.length > 0) {
                    const claimsBtn = document.createElement('button');
                    claimsBtn.textContent = `⚠️ View Claims (${item.total_claimed})`;
                    claimsBtn.className = 'bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition-colors';
                    claimsBtn.onclick = () => viewClaims(item.claims, item.name, item.brand);
                    btnDiv.appendChild(claimsBtn);
                }
                
                if (item.action === 'ACTIVE') {
                    const viewBtn = document.createElement('button');
                    viewBtn.textContent = '📋 View Batches';
                    viewBtn.className = 'bg-[#2E7D32] hover:bg-[#1B5E20] text-white px-3 py-1 rounded text-sm transition-colors';
                    viewBtn.onclick = () => viewBatches(item.name, item.brand);
                    btnDiv.appendChild(viewBtn);
                }
                
                const canRestore = ['DELETED', 'BATCH DELETED', 'PRODUCT DELETED'].includes(item.action);
                const isPermanent = item.action === 'PERMANENTLY DELETED';
                
                if (isPermanent) {
                    const disabledBtn = document.createElement('button');
                    disabledBtn.textContent = '❌ Cannot Restore';
                    disabledBtn.className = 'bg-gray-400 text-white px-3 py-1 rounded text-sm cursor-not-allowed';
                    disabledBtn.disabled = true;
                    btnDiv.appendChild(disabledBtn);
                } else if (canRestore && item.id && !item.is_permanent) {
                    const restoreBtn = document.createElement('button');
                    restoreBtn.textContent = '↻ Restore';
                    restoreBtn.className = 'bg-[#2E7D32] hover:bg-[#1B5E20] text-white px-3 py-1 rounded text-sm transition-colors';
                    restoreBtn.onclick = () => restoreItem(item.id);
                    btnDiv.appendChild(restoreBtn);
                } else if (item.action === 'UPDATED') {
                    const infoBtn = document.createElement('button');
                    infoBtn.textContent = 'ℹ️ Update History';
                    infoBtn.className = 'bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-sm transition-colors';
                    infoBtn.onclick = () => alert('This is an update history record.\n\nIt tracks changes made to products and cannot be restored.\n\n✅ The actual product is still active in inventory.');
                    btnDiv.appendChild(infoBtn);
                }
                
                card.appendChild(btnDiv);
                fragment.appendChild(card);
            });

            container.appendChild(fragment);
            
            if (!hasMore && allItems.length > 0 && allItems.length === totalItems) {
                const note = document.createElement('div');
                note.className = 'text-xs text-gray-400 text-center mt-2';
                note.innerText = `✅ All ${totalItems} items loaded`;
                container.appendChild(note);
            }
        }

        function viewClaims(claims, productName, brand) {
            const modalTitle = document.getElementById('claimsModalTitle');
            const container = document.getElementById('claimsList');
            container.innerHTML = '<div class="text-center text-gray-400 py-4"><i class="fas fa-spinner fa-spin"></i> Loading claims...</div>';
            modalTitle.innerText = `Claims – ${productName} (${brand})`;
            document.getElementById('claimsModal').classList.remove('hidden');

            if (!claims || claims.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-4">No claims found.</div>';
                return;
            }

            container.innerHTML = '';
            claims.forEach(claim => {
                const div = document.createElement('div');
                div.className = 'border border-[#E8F5E9] rounded p-3 mb-2';
                const statusColor = getClaimStatusColor(claim.status);
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-semibold">Claim #${claim.claim_id}</span>
                            <span class="text-xs ml-2" style="color: ${statusColor}">● ${claim.status}</span>
                        </div>
                        <span class="text-xs text-gray-500">${formatDate(claim.created_at)}</span>
                    </div>
                    <div class="mt-1">
                        <span class="font-medium">Issue:</span> ${escapeHtml(claim.issue_type)}
                    </div>
                    <div>
                        <span class="font-medium">Quantity:</span> ${claim.quantity} units
                    </div>
                    ${claim.batch_id ? `<div><span class="font-medium">Batch:</span> #${claim.batch_id}</div>` : ''}
                    ${claim.description ? `<div class="text-sm text-gray-600 mt-1">📝 ${escapeHtml(claim.description)}</div>` : ''}
                    ${claim.batch_identifier ? `<div class="text-xs text-gray-400 mt-1">Batch Identifier: ${claim.batch_identifier}</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function closeClaimsModal() {
            document.getElementById('claimsModal').classList.add('hidden');
        }

        async function viewBatches(name, brand) {
            const modalTitle = document.getElementById('batchModalTitle');
            const container = document.getElementById('batchList');
            container.innerHTML = '<div class="text-center text-gray-400 py-4"><i class="fas fa-spinner fa-spin"></i> Loading batches...</div>';
            modalTitle.innerText = `Batches – ${name} (${brand})`;
            document.getElementById('batchModal').classList.remove('hidden');

            const cacheKey = getBatchesCacheKey(name, brand);
            let batches = [];
            let fromCache = false;

            batches = await getCache(cacheKey);
            if (batches) {
                fromCache = true;
                renderBatches(batches);
            }

            if (navigator.onLine) {
                try {
                    const res = await fetch(`/api/archive/batches?name=${encodeURIComponent(name)}&brand=${encodeURIComponent(brand)}`);
                    if (!res.ok) throw new Error('Failed to load batches');
                    batches = await res.json();
                    if (batches && batches.length > 0) {
                        await putCache(cacheKey, batches);
                        fromCache = false;
                        renderBatches(batches);
                    }
                } catch (error) {
                    console.warn('Batch API failed, using cached data if available', error);
                    if (!batches || batches.length === 0) {
                        container.innerHTML = '<div class="text-gray-400 text-center py-4">Failed to load batches. Please try again.</div>';
                    }
                }
            } else if (!batches || batches.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-4">No cached batch data available offline.</div>';
            }
        }

        function renderBatches(batches) {
            const container = document.getElementById('batchList');
            if (!batches || batches.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-4">No batches found.</div>';
                return;
            }
            container.innerHTML = '';
            batches.forEach(b => {
                const div = document.createElement('div');
                div.className = 'border border-[#E8F5E9] rounded p-2 mb-2';
                const faultyBadge = (b.is_faulty || b.claimed_quantity > 0) 
                    ? `<span class="text-red-500 text-xs font-bold ml-2">⚠️ FAULTY (${b.claimed_quantity || 0} claimed)</span>` 
                    : '';
                div.innerHTML = `
                    <strong>Batch #${b.batch_id}</strong> ${faultyBadge}<br>
                    Qty: ${b.quantity} | Remaining: ${b.remaining_quantity}<br>
                    Cost: ${formatMoney(b.cost_price)} | Selling: ${formatMoney(b.selling_price)} | Disc: ${formatMoney(b.discount)}<br>
                    Date: ${formatDate(b.date)}
                `;
                container.appendChild(div);
            });
            if (!navigator.onLine) {
                const note = document.createElement('div');
                note.className = 'text-xs text-gray-400 text-center mt-2';
                note.innerText = '⚠️ Data may be outdated (offline)';
                container.appendChild(note);
            }
        }

        function closeBatchModal() {
            document.getElementById('batchModal').classList.add('hidden');
        }

        async function restoreItem(archiveId) {
            if (!navigator.onLine) {
                alert('Restoring requires internet. Please connect and try again.');
                return;
            }
            if (!confirm('Are you sure you want to restore this item?\n\n• Product will be added back to inventory\n• Batches will be restored\n• Stock levels will be recalculated')) {
                return;
            }
            try {
                const res = await fetch('/api/archive/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ archive_id: archiveId })
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ Item restored successfully!\n\nIt has been added back to your inventory.');
                    resetAndLoad();
                } else {
                    alert('❌ Restore failed: ' + data.error);
                }
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        // ---------- Event listeners ----------
        document.getElementById('statusFilter').addEventListener('change', resetAndLoad);
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(this._searchTimeout);
            this._searchTimeout = setTimeout(resetAndLoad, 500);
        });
        document.getElementById('loadMoreBtn').addEventListener('click', loadMore);

        window.addEventListener('online', function() {
            resetAndLoad();
        });

        resetAndLoad();
    });
</script>
{% endblock %}
