{% extends 'base.html' %}

{% block content %}
<div class="p-4 md:p-6 flex flex-col items-center justify-center min-h-[65vh]">

        <div class="text-7xl mb-6 animate-bounce">🚧</div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3 flex items-center justify-center gap-2">

        <p class="text-gray-500 mb-8 text-sm md:text-base">
            We are currently building this new module. The Medical Herbal Shop inventory, sales, and management features will be available soon.

        <div class="mt-8 pt-6 border-t border-gray-100">
